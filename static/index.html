<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kurage SEO｜日本語サイトのSEO診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/" aria-label="Kurage SEO トップへ">
    <img src="/static/images/kurage_mascot.png" alt="" width="36" height="36" onerror="this.style.display='none'">
    <span class="brand-name">Kurage SEO</span>
  </a>
  <div class="usage" id="usage"></div>
</header>

<main>
  <section class="hero">
    <h1>日本語サイトのSEOを、実測で診断する。</h1>
    <p>
      タイトルの長さは全角で数え、文字コードや <code>lang</code> 属性まで見ます。
      判定はすべて決定論的なチェックで、AIの推測は入りません。
    </p>
  </section>

  <section class="panel">
    <h2>サイトを登録して診断する</h2>
    <form id="siteForm" class="site-form">
      <label>
        <span>サイト名</span>
        <input id="siteName" type="text" maxlength="80" placeholder="株式会社エクスブリッジ" required>
      </label>
      <label>
        <span>URL</span>
        <input id="siteUrl" type="text" maxlength="500" placeholder="https://example.co.jp/" required>
      </label>
      <button type="submit" class="primary">登録する</button>
    </form>
    <p class="note" id="formNote"></p>
  </section>

  <section class="panel">
    <h2>登録したサイト</h2>
    <div id="siteList" class="site-list"><p class="muted">読み込み中…</p></div>
  </section>

  <section class="panel" id="resultPanel" hidden>
    <h2>診断結果</h2>
    <div id="result"></div>
  </section>
</main>

<footer>
  <p>Kurage SEO — 株式会社エクスブリッジ</p>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
